{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">

        <!-- Card container for the login form -->
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">

                <!-- Heading -->
                <h4 class="card-title text-center mb-4">
                    <i class="bi bi-shield-lock-fill text-primary me-2"></i>Admin Login
                </h4>

                <!-- Login form -->
                <!-- method="POST" sends the password securely in the request body -->
                <!-- action="/admin/login" tells the form where to submit -->
                <form method="POST" action="/admin/login">

                    <!-- Password field -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">
                            Password
                        </label>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter admin password"
                            required
                            autofocus
                        >
                        <!-- 'name="password"' is how Flask reads this value on the server -->
                    </div>

                    <!-- Submit button -->
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Login
                        </button>
                    </div>

                </form>

            </div>
        </div>

        <!-- Small helper text below the card -->
        <p class="text-center text-muted mt-3">
            <small>This area is for administrators only.</small>
        </p>

    </div>
</div>
{% endblock %}
